aid: crv
name: CRV
description: >-
  CRV (formerly Charles River Ventures) is one of the oldest venture capital
  firms in the United States, founded in 1970 to commercialize research coming
  out of MIT. The firm invests early — primarily at the Seed and Series A stages,
  with occasional Series B — leading rounds in enterprise, consumer, developer
  tools, security, data infrastructure, AI, and bioengineering companies. CRV
  has backed more than 750 companies since inception across 18 funds, raising
  over $4.3 billion (including a recent $600M early-stage fund), and has seen
  80-plus of its portfolio companies reach public-company status. Notable
  investments include DoorDash, Airtable, HubSpot, Datadog, Zendesk, Patreon,
  Mercury, Vercel, Cursor, Postman, Kong, Tailscale, Ring, and PillPack. The
  firm is headquartered in San Francisco (52 Zoe Street) with a long-standing
  Bay Area presence and offices in Menlo Park, CA and Cambridge, MA.
